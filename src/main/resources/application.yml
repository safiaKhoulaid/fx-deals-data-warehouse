spring:
  datasource:

    url: jdbc:postgresql://localhost:5432/bloomberg_warehouse
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      root: INFO
      com.progresssoft.warehouse: DEBUG
    file:
      name: logs/warehouse-app.log
    logback:
      rollingpolic:
        max-file-size: 10MB
        max-history: 7
        file-name-pattern: logs/warehouse-app-%d{yyyy-MM-dd}.%i.log
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
      file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

